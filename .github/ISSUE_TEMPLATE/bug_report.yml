name: Bug report
description: A calculation, simulation, example, or documentation issue
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include runnable code, all parameters, and a simulation seed if applicable. English or Russian is welcome.
      render: python
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Paste the output or traceback. For a mathematical discrepancy, give the reference equation and assumptions.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Most-Queue version or Git commit, Python/NumPy/SciPy versions, and operating system.
    validations:
      required: true

error_msg: "System simulation results do not match theoretical values"

num_of_channels: 3
num_of_jobs: 100000
# Preemptive / SRPT-style sim vs theory: higher N for sample mean of E[W], E[T]
num_of_jobs_srpt: 300000
sim_to_average: 1

utilization_factor: 0.7
buffer: 30

probs_rtol: 1e-3 
probs_atol: 1e-2

moments_atol: 2.0
moments_rtol: 0.5

dynamic_batching:
  replications: 8
  jobs_per_replication: 30000
  standard_errors: 4.5
  relative_floor: 0.005
token_batching:
  replications: 8
  jobs_per_replication: 20000
  standard_errors: 4.5
  relative_floor: 0.005
kv_cache_stability:
  replications: 6
  slots_per_replication: 3000
  warmup_slots: 500
  standard_errors: 4.5
  absolute_floor: 0.04
prefill_decode:
  replications: 6
  jobs_per_replication: 12000
  standard_errors: 4.5
  absolute_floor: 0.005

arrival:
  rate: 1.0
  cv: 0.56 # coefficient of variation (CV) for arrival time if it not markovian
  # For Takahashi–Takami validation tests:
  # - cv_ge1: real H2 exists and can be simulated by QsSim ("H")
  # - cv_lt1: complex-fit H2 may be used in calculations; simulation uses Gamma as proxy
  cv_ge1: 1.2
  cv_lt1: 0.56

service:
  cv: 1.2
  cv_ge1: 1.2
  cv_lt1: 0.8

warm-up:
  cv: 1.2
  mean: 3.0

cooling:
  cv: 1.2
  mean: 3.0

cooling-delay:
  cv: 1.2
  mean: 3.0


